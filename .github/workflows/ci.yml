name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholder, correctly-*shaped* values only — not real credentials.
  # Lets `next build` and env validation (lib/env.*.ts) succeed without a
  # live Supabase project, matching local dev's .env.local. Real secrets
  # (a live project's anon/service-role keys) belong in repo/environment
  # secrets once staging exists, referenced the same way, never inlined.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
  MONNIFY_API_KEY: "placeholder-monnify-api-key"
  MONNIFY_API_SECRET: "placeholder-monnify-api-secret"
  MONNIFY_CONTRACT_CODE: "placeholder-contract-code"
  MONNIFY_BASE_URL: "https://sandbox.monnify.com"

jobs:
  build:
    name: lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §18: "Add a CI grep that fails the build if [the service-role key]
      # appears" outside the two files allowed to reference it, and that no
      # NEXT_PUBLIC_ var name suggests a secret.
      - name: Guard against service-role key leakage
        run: |
          set -euo pipefail

          # apps/web/src/lib/monnify.ts references serverEnv.MONNIFY_API_SECRET
          # (an env var *name*, sourced from lib/env.server.ts — never a
          # literal secret value) to build the Monnify basic-auth header and
          # verify the webhook's HMAC signature. That is not a leak, but
          # excluding the whole file by path (as a prior round did) would let
          # a real hardcoded secret added anywhere in that same file slip
          # past undetected. Excluding narrowly by PATTERN instead
          # (`serverEnv.<NAME>`, the only legitimate way to reference either
          # secret outside lib/env.server.ts/lib/supabase/admin.ts) keeps the
          # check meaningful for every other line in the file, including a
          # newly hardcoded literal.
          leaked=$(grep -rInE "SERVICE_ROLE|MONNIFY_API_SECRET" apps/web/src packages/*/src 2>/dev/null \
            | grep -v "apps/web/src/lib/env.server.ts" \
            | grep -v "apps/web/src/lib/supabase/admin.ts" \
            | grep -vE "serverEnv\.(SUPABASE_SERVICE_ROLE_KEY|MONNIFY_API_SECRET)" \
            || true)

          if [ -n "$leaked" ]; then
            echo "A secret (service-role key or Monnify API secret) is referenced outside the files allowed to touch it:"
            echo "$leaked"
            exit 1
          fi

          exposed=$(grep -rEn "NEXT_PUBLIC_[A-Z_]*(SERVICE|SECRET|PRIVATE)" apps/web/src packages/*/src 2>/dev/null || true)
          if [ -n "$exposed" ]; then
            echo "A NEXT_PUBLIC_ var name suggests a secret is being exposed to the client:"
            echo "$exposed"
            exit 1
          fi

      - name: lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

      # Edge Function logic (Expo push + messaging helpers) is plain TypeScript with node:test; Deno is not
      # needed. A directory argument does not work on Node 22 (it is resolved as a module), so use a glob.
      # monnify-webhook/monnify.test.ts is a Deno test and is deliberately not matched.
      - name: Edge Function unit tests (node --test)
        run: node --experimental-strip-types --test "supabase/functions/_shared/*.test.ts"

  pgtap:
    name: pgTAP (RLS + transition_order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase and apply migrations
        run: supabase start

      # Explicit file list on purpose: supabase/tests/ also holds NON-pgTAP files in subfolders
      # (h3/bench-discovery.sql is a psql-variable benchmark, h3/migration.template.sql a template,
      # concurrency/ is a Node harness). Only the top-level *.sql files are pgTAP suites.
      - name: Run pgTAP tests
        run: supabase test db $(ls supabase/tests/*.sql)

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # The multi-session race harness (supabase/tests/concurrency, see its README). pgTAP runs in one
  # transaction and cannot prove anything about two backends at once. It needs its OWN isolated stack
  # (it commits rows and refuses the default ports), which apps/web/e2e/support/stack.mjs creates
  # (project kiakia-e2ecycle, db :58322; it also serves the monnify-webhook function, which makes the
  # start slow). A reduced scale keeps this job to a few minutes; run the full scale (no --scale)
  # locally before a release. NOT yet run on a GitHub runner: if the stack start proves flaky there,
  # this job is the one to demote to a manual workflow (the README still lists the local recipe).
  concurrency:
    name: dispatch concurrency harness (scale 0.25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the isolated e2e stack (replays every migration + seed)
        run: SUPABASE_CLI=supabase pnpm --filter web e2e:cycle:up

      - name: Run the harness
        working-directory: supabase/tests/concurrency
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          node run.mjs --scale 0.25 --db-url postgresql://postgres:postgres@127.0.0.1:58322/postgres

      - name: Tear the stack down
        if: always()
        run: SUPABASE_CLI=supabase pnpm --filter web e2e:cycle:down
