# Local Supabase project config — see https://supabase.com/docs/guides/local-development/cli/config
# Hand-authored (interactive `supabase init` couldn't complete non-interactively
# in this sandbox) rather than left missing: without this file, `supabase
# start`/`supabase test db` (ci.yml's `pgtap` job) has no project to start
# and fails before ever applying a migration.

project_id = "kiakia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[functions.monnify-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/monnify-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/monnify-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/monnify-webhook/*.html" ]

[functions.dispatch-push]
enabled = true
# No verify_jwt override, unlike monnify-webhook — this keeps the platform
# default (true). Its only caller is migration 0062's trigger, which
# authenticates with the service-role key read from Vault. See
# supabase/functions/dispatch-push/index.ts's header.
import_map = "./functions/dispatch-push/deno.json"
entrypoint = "./functions/dispatch-push/index.ts"

[functions.web-push]
enabled = true
# Same trust boundary as dispatch-push — no verify_jwt override. Its only
# caller is 0069_web_push_subscriptions.sql's trigger, which authenticates
# with the service-role key read from Vault. See
# supabase/functions/web-push/index.ts's header.
import_map = "./functions/web-push/deno.json"
entrypoint = "./functions/web-push/index.ts"

[functions.message-worker]
enabled = true
# verify_jwt = false: the caller (pg_cron -> invoke_message_worker(), migration
# 0096) authenticates with the shared `x-worker-secret` header instead, checked
# in constant time against MESSAGE_WORKER_SECRET. See
# supabase/functions/message-worker/index.ts's header.
verify_jwt = false
import_map = "./functions/message-worker/deno.json"
entrypoint = "./functions/message-worker/index.ts"

[functions.message-webhooks]
enabled = true
# Public provider callbacks (Resend / Termii): Svix signature or shared token is
# the only authority. See supabase/functions/message-webhooks/index.ts.
verify_jwt = false
import_map = "./functions/message-webhooks/deno.json"
entrypoint = "./functions/message-webhooks/index.ts"

# pgTAP helpers for images that do not ship supabase_test_helpers (see 0013 and
# test_helpers_shim.sql). Local/CI only: db push does not run seeds.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./test_helpers_shim.sql"]
