# Local Supabase project config — see https://supabase.com/docs/guides/local-development/cli/config
# Hand-authored (interactive `supabase init` couldn't complete non-interactively
# in this sandbox) rather than left missing: without this file, `supabase
# start`/`supabase test db` (ci.yml's `pgtap` job) has no project to start
# and fails before ever applying a migration.

project_id = "kiakia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
